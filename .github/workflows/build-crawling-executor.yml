name: CrawlingExecutor build & test

on:
  pull_request:
    branches:
      - main
    paths:
      - 'CrawlingExecutor/**'

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          java-version: '20'
          distribution: 'temurin'
          cache: maven

      - name: Build with maven
        run: mvn -B package --file pom.xml
        working-directory: CrawlingExecutor

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Crawling_SNAPSHOT.jar
          path: CrawlingExecutor/target/*.jar

      - name: Run test
        run: mvn test
        working-directory: CrawlingExecutor

      - name: Test Reporter with PR Comment
        if: always()
        uses: n-ryu/test-reporter@v0.0.2
        with:
          name: Junit tests
          path: CrawlingExecutor/target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: 'true'

      - name: Add coverage comments to PR
        if: always()
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: CrawlingExecutor/target/site/jacoco/jacoco.xml
          token: ${{ github.token }}
          update-comment: true
          title: Test coverage report
